name: build
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Diagnose generator
        shell: pwsh
        run: |
          dotnet --list-sdks
          Write-Host "TL exists: $(Test-Path Libraries\tdjson\td_api.tl)"
          Get-ChildItem Libraries\tdjson -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host "TDJSON: $($_.Name)" }
          $p = Get-ChildItem Telegram.Generators.Cli -Filter *.csproj | Select-Object -First 1
          Write-Host "CLI PROJECT: $($p.FullName)"
          dotnet build $p.FullName -c Release 2>&1 | Select-Object -Last 15
          $dll = "Telegram.Generators.Cli\bin\Release\net10.0\Telegram.Generators.Cli.dll"
          Write-Host "DLL exists: $(Test-Path $dll)"
          dotnet $dll --schema Libraries\tdjson\td_api.tl --out "$env:RUNNER_TEMP\tdschema" --parsers Pointer 2>&1 | Select-Object -First 40
          Write-Host "EXIT: $LASTEXITCODE"
          exit 0
