name: build
on: workflow_dispatch
jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Scan
        shell: pwsh
        run: |
          $o = New-Object System.Collections.Generic.List[string]
          $o.Add("== CONSTANTS KEYS ==")
          Get-ChildItem Telegram -Filter "Constants*.cs" -ErrorAction SilentlyContinue | Select-String -Pattern 'ApiId|ApiHash|AppChannel' | ForEach-Object { $o.Add("$($_.Filename):$($_.LineNumber): $($_.Line.Trim())") }
          $src = Get-ChildItem Libraries\tgcalls, Telegram.Native.Calls -Recurse -Include *.cpp,*.cc,*.h,*.mm -ErrorAction SilentlyContinue
          $o.Add("== DELAY / BUFFER ==")
          $src | Select-String -Pattern 'jitter|min_delay|playout_delay|PlayoutDelay|target_delay' | Select-Object -First 40 | ForEach-Object { $o.Add("$($_.Path.Replace($PWD.Path,'')):$($_.LineNumber): $($_.Line.Trim())") }
          $o.Add("== PROCESSING ==")
          $src | Select-String -Pattern 'echo_cancel|noise_suppress|auto_gain|high_pass|audio_processing|AudioProcessing' | Select-Object -First 30 | ForEach-Object { $o.Add("$($_.Path.Replace($PWD.Path,'')):$($_.LineNumber): $($_.Line.Trim())") }
          $o | Set-Content scan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scan
          path: scan.txt
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [clean]
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UnigramDev/Unigram
          ref: v12.10.7
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Set API keys
        if: matrix.variant != 'clean'
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          $id = $env:TG_API_ID.Trim()
          $hash = $env:TG_API_HASH.Trim()
          if ($id -notmatch '^\d+$') { throw "TG_API_ID must be digits only" }
          if ($hash -notmatch '^[0-9a-fA-F]{32}$') { throw "TG_API_HASH must be 32 hex chars" }
          Get-ChildItem Telegram -Filter "Constants*" | ForEach-Object { Write-Host "FILE: $($_.Name)" }
          Write-Host "== Constants.cs (first 60 lines) =="
          Get-Content Telegram\Constants.cs | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
          $cs = Get-Content Telegram\Constants.cs -Raw
          if ($cs -match 'static\s+Constants\s*\(') { throw "Constants.cs already has a static constructor" }
          if ($cs -notmatch 'partial\s+class\s+Constants') { throw "Constants is not a partial class" }
          if ($cs -notmatch 'readonly\s+\w+\s+ApiId\b') { throw "ApiId is not a readonly field" }
          if ($cs -notmatch 'readonly\s+\w+\s+ApiHash\b') { throw "ApiHash is not a readonly field" }
          $body = @("            ApiId = $id;", "            ApiHash = `"$hash`";")
          if ($cs -match 'readonly\s+\w+\s+AppChannel\b') { $body += '            AppChannel = "unigram";' }
          $lines = @('namespace Telegram','{','    public static partial class Constants','    {','        static Constants()','        {') + $body + @('        }','    }','}')
          Set-Content -Path Telegram\Constants.Secret.cs -Value $lines -Encoding UTF8
          Write-Host "Secret file written with $($body.Count) assignments"
      - name: Patch audio settings
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          $files = Get-ChildItem Libraries\tgcalls, Telegram.Native.Calls -Recurse -Include *.cpp,*.cc,*.h,*.mm -ErrorAction SilentlyContinue
          $rules = @(
            @('(jitter_buffer_min_delay_ms\s*=\s*)\d+', '${1}0'),
            @('(jitter_buffer_max_packets\s*=\s*)\d+', '${1}20'),
            @('(jitter_buffer_fast_accelerate\s*=\s*)(true|false)', '${1}true'),
            @('(echo_cancellation\s*=\s*)true', '${1}false'),
            @('(noise_suppression\s*=\s*)true', '${1}false'),
            @('(auto_gain_control\s*=\s*)true', '${1}false'),
            @('(highpass_filter\s*=\s*)true', '${1}false')
          )
          $rep = New-Object System.Collections.Generic.List[string]
          foreach ($f in $files) {
            $t = Get-Content $f.FullName -Raw
            $n = $t
            foreach ($r in $rules) {
              $m = [regex]::Matches($n, $r[0]).Count
              if ($m -gt 0) { $n = [regex]::Replace($n, $r[0], $r[1]); $rep.Add("$($f.Name): $($r[0]) x$m") }
            }
            if ($n -ne $t) { Set-Content $f.FullName $n -NoNewline }
          }
          if ($rep.Count -eq 0) { $rep.Add("NO AUDIO SETTINGS FOUND - nothing patched") }
          $rep | Set-Content patch.txt
          $rep | ForEach-Object { Write-Host $_ }
      - name: TDLib cache key
        id: tdkey
        shell: pwsh
        run: |
          $h = git -C Libraries/tdlib rev-parse HEAD
          "key=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore tdjson cache
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: Libraries/tdjson/x64
          key: tdjson-${{ steps.tdkey.outputs.key }}-${{ hashFiles('Libraries/tdjson/build.ps1') }}
      - name: Copy td_api.tl
        shell: pwsh
        run: Copy-Item Libraries\tdlib\td\generate\scheme\td_api.tl Libraries\tdjson\td_api.tl -Force
      - name: Install gperf
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install gperf -y --no-progress
          $gperf = Get-Command gperf -ErrorAction SilentlyContinue
          if (-not $gperf) {
            $p = Get-ChildItem "C:\ProgramData\chocolatey\lib\gperf" -Recurse -Filter gperf.exe | Select-Object -First 1
            "$($p.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$($p.DirectoryName);$env:PATH"
          }
          gperf --version
      - name: Build tdjson
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Push-Location Libraries\tdjson
          & .\build.ps1 -vcpkg_root $env:VCPKG_INSTALLATION_ROOT -arch x64 *>&1 | Tee-Object -FilePath ..\..\tdjson.log
          Pop-Location
          Get-ChildItem Libraries\tdjson\x64 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $($_.Name)" }
      - name: Save tdjson cache
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libraries/tdjson/x64
          key: tdjson-${{ steps.tdkey.outputs.key }}-${{ hashFiles('Libraries/tdjson/build.ps1') }}
      - name: Create signing cert
        shell: pwsh
        run: |
          $m = Get-ChildItem -Recurse -Filter Package.appxmanifest | Where-Object { $_.FullName -notmatch 'Libraries' } | Select-Object -First 1
          [xml]$x = Get-Content $m.FullName
          $pub = $x.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature -FriendlyName "MeroGram" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pw = ConvertTo-SecureString "mero123" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\key.pfx" -Password $pw
          Export-Certificate -Cert $cert -FilePath "MeroGram.cer"
      - name: Build app
        shell: pwsh
        run: |
          $t = Get-ChildItem -Filter *.slnx | Select-Object -First 1
          msbuild $t.FullName -t:Restore -p:RestorePackagesConfig=true -p:Configuration=Release -p:Platform=x64
          msbuild $t.FullName /m:1 /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true "/p:PackageCertificateKeyFile=$env:RUNNER_TEMP\key.pfx" /p:PackageCertificatePassword=mero123 "/flp:logfile=errors.log;errorsonly;verbosity=quiet"
      - name: Collect package
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Get-ChildItem -Recurse -Directory -Filter AppPackages -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'vcpkg_installed|\\Libraries\\' } | ForEach-Object { Copy-Item "$($_.FullName)\*" dist -Recurse -Force }
          Copy-Item MeroGram.cer dist -ErrorAction SilentlyContinue
          Get-ChildItem dist -Recurse | ForEach-Object { Write-Host "DIST: $($_.FullName.Replace($PWD.Path,''))" }
      - name: Strip appxsym
        if: always()
        shell: pwsh
        run: Get-ChildItem dist -Recurse -Filter *.appxsym -ErrorAction SilentlyContinue | Remove-Item -Force
      - name: Pack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) { Compress-Archive -Path dist\* -DestinationPath MeroGram.zip -Force; (Get-FileHash MeroGram.zip -Algorithm SHA256).Hash | Set-Content hash.txt }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.variant }}
          compression-level: 0
          path: |
            MeroGram.zip
            hash.txt
            errors.log
            tdjson.log
            patch.txt
          retention-days: 3
          if-no-files-found: warn
