name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Find and build
        shell: pwsh
        run: |
          Write-Host "== ROOT FILES =="
          Get-ChildItem | ForEach-Object { Write-Host "ROOT: $($_.Name)" }
          Write-Host "== SOLUTIONS =="
          Get-ChildItem -Recurse -Include *.slnx,*.sln,*.wapproj | ForEach-Object { Write-Host "FOUND: $($_.FullName.Replace($PWD.Path,''))" }
          $t = Get-ChildItem -Filter *.slnx | Select-Object -First 1
          if (-not $t) { $t = Get-ChildItem -Recurse -Filter *.wapproj | Select-Object -First 1 }
          if (-not $t) { Write-Host "NO TARGET FOUND"; exit 1 }
          Write-Host "BUILDING: $($t.FullName)"
          msbuild $t.FullName -restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            **/AppPackages/**
            **/bin/x64/Release/**
