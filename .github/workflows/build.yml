name: build
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read tdjson build script
        shell: pwsh
        run: |
          Write-Host "== BUILD.PS1 =="
          Get-Content Libraries\tdjson\build.ps1 | Select-Object -First 90
          Write-Host "== LIBRARIES.MD =="
          Get-Content Libraries\Libraries.md -ErrorAction SilentlyContinue | Select-Object -First 40
          Write-Host "== TDLIB DIR =="
          Get-ChildItem Libraries\tdlib | Select-Object -First 25 | ForEach-Object { Write-Host "TDLIB: $($_.Name)" }
          Write-Host "== VCPKG-PORTS =="
          Get-ChildItem Libraries\vcpkg-ports | Select-Object -First 15 | ForEach-Object { Write-Host "PORTS: $($_.Name)" }
          exit 0
