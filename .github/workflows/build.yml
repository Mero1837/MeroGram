name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Build
        shell: pwsh
        run: |
          $all = Get-ChildItem -Recurse -Filter *.sln | Select-Object -ExpandProperty FullName
          $all | ForEach-Object { Write-Host "SLN: $_" }
          $sln = $all | Where-Object { $_ -like "*\Unigram.sln" } | Select-Object -First 1
          if (-not $sln) { throw "Unigram.sln not found" }
          nuget restore $sln
          msbuild $sln /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            **/AppPackages/**
            **/bin/x64/Release/**
