name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Find and build
        shell: pwsh
        run: |
          $t = Get-ChildItem -Filter *.slnx | Select-Object -First 1
          if (-not $t) { Write-Host "NO SLNX FOUND"; exit 1 }
          msbuild $t.FullName -t:Restore -p:RestorePackagesConfig=true -p:Configuration=Release -p:Platform=x64
          msbuild $t.FullName /m:1 /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never "/flp:logfile=errors.log;errorsonly;verbosity=quiet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            errors.log
            AppPackages/**
            Unigram/**/AppPackages/**
          if-no-files-found: warn
