name: build
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Find td_api.tl
        shell: pwsh
        run: |
          Write-Host "== FIND TL =="
          Get-ChildItem -Recurse -Filter "td_api.tl" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "TL: $($_.FullName.Replace($PWD.Path,''))" }
          Write-Host "== LIBRARIES =="
          Get-ChildItem Libraries -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "LIB: $($_.Name)" }
          Write-Host "== TDJSON =="
          Get-ChildItem Libraries\tdjson -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "TDJSON: $($_.Name)" }
          Write-Host "== GITMODULES =="
          Get-Content .gitmodules
          Write-Host "== TARGETS =="
          Get-Content Telegram\TdSchema.targets | Select-Object -First 80
          exit 0
