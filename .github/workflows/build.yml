name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Install gperf
        shell: pwsh
        run: |
          choco install gperf -y --no-progress
          $gperf = Get-Command gperf -ErrorAction SilentlyContinue
          if (-not $gperf) {
            $p = Get-ChildItem "C:\ProgramData\chocolatey\lib\gperf" -Recurse -Filter gperf.exe | Select-Object -First 1
            "$($p.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$($p.DirectoryName);$env:PATH"
          }
          gperf --version
      - name: Build tdjson
        shell: pwsh
        run: |
          Copy-Item Libraries\tdlib\td\generate\scheme\td_api.tl Libraries\tdjson\td_api.tl -Force
          Push-Location Libraries\tdjson
          Write-Host "VCPKG ROOT: $env:VCPKG_INSTALLATION_ROOT"
          & .\build.ps1 -vcpkg_root $env:VCPKG_INSTALLATION_ROOT -arch x64 *>&1 | Tee-Object -FilePath ..\..\tdjson.log
          Pop-Location
          Get-ChildItem Libraries\tdjson\x64 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $($_.Name)" }
      - name: Create signing cert
        shell: pwsh
        run: |
          $m = Get-ChildItem -Recurse -Filter Package.appxmanifest | Where-Object { $_.FullName -notmatch 'Libraries' } | Select-Object -First 1
          Write-Host "MANIFEST: $($m.FullName)"
          [xml]$x = Get-Content $m.FullName
          $pub = $x.Package.Identity.Publisher
          Write-Host "PUBLISHER: $pub"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature -FriendlyName "MeroGram" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pw = ConvertTo-SecureString "mero123" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\key.pfx" -Password $pw
          Export-Certificate -Cert $cert -FilePath "MeroGram.cer"
      - name: Build app
        shell: pwsh
        run: |
          $t = Get-ChildItem -Filter *.slnx | Select-Object -First 1
          msbuild $t.FullName -t:Restore -p:RestorePackagesConfig=true -p:Configuration=Release -p:Platform=x64
          msbuild $t.FullName /m:1 /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true "/p:PackageCertificateKeyFile=$env:RUNNER_TEMP\key.pfx" /p:PackageCertificatePassword=mero123 "/flp:logfile=errors.log;errorsonly;verbosity=quiet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            errors.log
            tdjson.log
            MeroGram.cer
            **/AppPackages/**
          if-no-files-found: warn
